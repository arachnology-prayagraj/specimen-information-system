<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Specimen Details</title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .card {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .item {
      margin-bottom: 18px;
    }

    .label {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 5px;
      color: #333;
    }

    .value {
      color: #555;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .more-info {
      margin-top: 25px;
      text-align: center;
    }

    .more-info a {
      display: inline-block;
      padding: 12px 22px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .more-info a:hover {
      opacity: 0.85;
    }

    .loading {
      text-align: center;
      color: #555;
    }

    .error {
      text-align: center;
      color: #b00020;
    }

  </style>

</head>


<body>

  <div class="card">

    <h2>Specimen Details</h2>

    <div id="data" class="loading">
      Loading...
    </div>

  </div>


  <script>

    // Get ID from URL
    const id = new URLSearchParams(window.location.search).get("id");


    // Your latest Google Apps Script Web App URL
    const scriptURL =
      "https://script.google.com/macros/s/AKfycbzsx_xzsfYk6aMTa9Noy1a40PcsrzqcZRCJgzY-Pvc5lHAnfY6OtPN9SXqrwCINr0M_/exec";


    // Check whether ID exists
    if (!id) {

      document.getElementById("data").innerHTML =
        '<p class="error">Specimen ID is missing.</p>';

    } else {

      // Fetch data from Google Apps Script
      fetch(scriptURL + "?id=" + encodeURIComponent(id))

        .then(response => response.json())

        .then(d => {

          // If an error is returned
          if (d.error) {

            document.getElementById("data").innerHTML =
              '<p class="error">' + d.error + '</p>';

            return;
          }


          // Basic specimen information
          let html = `

            <div class="item">
              <div class="label">ID</div>
              <div class="value">${d.id}</div>
            </div>


            <div class="item">
              <div class="label">Taxonomy</div>
              <div class="value">${d.taxonomy}</div>
            </div>


            <div class="item">
              <div class="label">Name</div>
              <div class="value">${d.name}</div>
            </div>


            <div class="item">
              <div class="label">Collection Information</div>
              <div class="value">${d.collection_information}</div>
            </div>


            <div class="item">
              <div class="label">Physical Traits</div>
              <div class="value">${d.physical_traits}</div>
            </div>


            <div class="item">
              <div class="label">Status</div>
              <div class="value">${d.status}</div>
            </div>

          `;


          // More Information button
          // Only show button if URL exists
          if (d.more_information && d.more_information.trim() !== "") {

            html += `

              <div class="more-info">

                <a href="${d.more_information}"
                   target="_blank"
                   rel="noopener noreferrer">

                  More Information

                </a>

              </div>

            `;

          }


          // Display everything
          document.getElementById("data").innerHTML = html;

        })


        .catch(error => {

          console.error(error);

          document.getElementById("data").innerHTML =
            '<p class="error">Unable to load specimen information.</p>';

        });

    }

  </script>

</body>

</html>
